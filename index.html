#scoreBox .lbl{font-size:12px;color:#a06a3c;line-height:12px}
#score{font-size:30px;line-height:34px;color:var(--red);text-shadow:3px 3px 0 #f0c98f}
#hearts{position:absolute;right:12px;top:10px;display:flex;gap:4px;z-index:5}
#hearts img{width:44px;height:40px}
#progress{position:absolute;right:12px;top:56px;color:var(--cream);padding:0 6px;font-size:12px;z-index:5;line-height:16px}
#combo{position:absolute;left:18px;top:108px;color:#fff;font-size:18px;line-height:22px;padding:0 6px;z-index:5;opacity:0}
#speedUp{position:absolute;left:50%;top:150px;transform:translateX(-50%);color:#fff;font-size:24px;line-height:30px;padding:2px 12px;z-index:25;display:none}
#speedUp.on{display:block;animation:blink .4s steps(2) 4}
#combo.on{opacity:1;animation:blink .5s steps(2) 3}
@keyframes blink{50%{opacity:.55}}
.hudbtn{position:absolute;top:12px;z-index:6;font-size:12px;line-height:14px;padding:0 4px;color:var(--cream);cursor:pointer;background:none}
.hudbtn:active{transform:translateY(2px)}
#pauseBtn{right:276px}#muteBtn{right:196px}

/* 손님 */
#customer{position:absolute;left:250px;bottom:290px;width:200px;height:200px;transform:translateX(-520px);transition:transform .55s steps(8);z-index:2}
#customer.in{transform:translateX(0)}
#customer.out{transform:translateX(760px);transition:transform .6s steps(8)}
#customer img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:200px}
#customer.bounce img{animation:bounce .4s steps(4)}
#customer.shake img{animation:shake .4s steps(4)}
@keyframes bounce{50%{transform:translate(-50%,-16px)}}
@keyframes shake{25%{transform:translate(-56%,0)}75%{transform:translate(-44%,0)}}

#bubble{position:absolute;left:478px;top:62px;width:392px;min-height:124px;padding:4px 10px;z-index:3;opacity:0;visibility:hidden}
#bubble.show{opacity:1;visibility:visible;animation:popin .2s steps(3)}
@keyframes popin{0%{transform:scale(.7)}100%{transform:scale(1)}}
#bubble .tail{position:absolute;left:-36px;top:30px;width:28px;height:36px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAkCAYAAACaJFpUAAAAW0lEQVR4nGNgGAVDHTDS2gJrZZH/yHwmWluIDoa/hRTHIXocoYMjd16j8Id/kA6+OCQ1jgiB4R+k9I9DascRITD8g3Q0H1IdDH8LR+vDoW/haLt06Fs4CoY+AAAVpxcAG34k0wAAAABJRU5ErkJggg==) center/100% 100% no-repeat}
#bubble .ask{font-size:12px;color:#a06a3c;line-height:18px}
#bubble .sent{font-size:24px;line-height:36px;word-break:keep-all}
#bubble .blank{display:inline-block;min-width:72px;text-align:center;color:var(--red);background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 12px) bottom/100% 4px no-repeat}
#bubble .fill-ok{color:var(--green);background:linear-gradient(var(--green),var(--green)) bottom/100% 4px no-repeat}
#bubble .tip{font-size:12px;line-height:18px;color:#5a3a22;margin-top:4px;padding:2px 6px;word-break:keep-all}
#bubble .tip b{color:#fff;background:var(--red);padding:0 4px;margin-right:6px}
#patience{position:absolute;left:478px;top:206px;width:392px;height:22px;z-index:3;visibility:hidden;padding:0}
#patience.show{visibility:visible}
#patience i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--c,#5cb83a) 0 10px,transparent 10px 12px)}

/* 틀 */
#grid{position:absolute;left:285px;top:252px;width:390px;height:286px;z-index:4}
.mold{position:absolute;width:124px;height:161px;cursor:pointer}
.mold img{width:100%;height:100%}
.mold .word{position:absolute;left:8%;right:12%;top:38%;text-align:center;font-size:24px;line-height:28px;color:#fff;pointer-events:none;white-space:nowrap;letter-spacing:-1px}
.mold .bar{position:absolute;left:22%;right:22%;bottom:23%;height:10px;background:#1a0e06;padding:2px;pointer-events:none}
.mold .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 8px)}
.px-puff{position:absolute;left:50%;top:2%;width:6px;height:6px;pointer-events:none;animation:puff 1.2s steps(6) infinite}
.px-puff.steam{background:#fff;box-shadow:-18px 6px 0 #fff,-12px 0 0 #fff,18px 4px 0 #fff,12px -2px 0 #fff,0 -8px 0 #fff;opacity:.85}
.px-puff.smoke{width:8px;height:8px;background:#777;box-shadow:-20px 6px 0 #777,-12px -4px 0 #555,20px 4px 0 #777,12px -6px 0 #555,0 -12px 0 #666,-6px -18px 0 #888,8px -22px 0 #888}
@keyframes puff{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.mold.cooked{animation:pop .25s steps(3)}
@keyframes pop{50%{transform:scale(1.08)}}
.mold.warn img{animation:warn .5s steps(2) infinite}
@keyframes warn{50%{filter:brightness(1.3) sepia(.5)}}
.mold.burnt img{filter:brightness(.7)}
.mold .clean{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;font-size:20px;line-height:20px;padding:0 4px;white-space:nowrap;pointer-events:none;animation:nudge .6s steps(2) infinite}
@keyframes nudge{50%{transform:translate(-50%,-64%)}}
.mold:active{transform:translateY(3px)}

/* 도구 */
#kettleBtn{position:absolute;left:60px;top:300px;width:170px;height:200px;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:4}
#kettleBtn img{width:150px}
#kettleBtn:active img{transform:rotate(-15deg)}
.tag{font-size:12px;line-height:16px;margin-top:4px;padding:0 4px;white-space:nowrap}
#tray{position:absolute;right:50px;top:300px;width:180px;height:200px;display:flex;flex-direction:column;align-items:center;z-index:4}
#tray .plate{width:140px}
#tray .tongs{position:absolute;right:-20px;top:-10px;width:110px;transform:rotate(-15deg)}

.fly{position:absolute;width:100px;z-index:20;transition:transform .45s steps(9),opacity .45s steps(9);pointer-events:none}
.pop{position:absolute;z-index:21;font-size:24px;pointer-events:none;animation:up 1s steps(8) forwards}
@keyframes up{to{transform:translateY(-48px);opacity:0}}

/* 화면 */
.screen{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,rgba(30,16,8,.62) 0 2px,rgba(30,16,8,.5) 2px 4px)}
.screen.on{display:flex}
.panel{text-align:center;max-width:840px;padding:14px 22px}
h1{font-size:48px;line-height:56px;color:var(--gold);letter-spacing:2px}
h1 .t2{color:#fff}
.sub{font-size:12px;line-height:18px;margin-top:6px;color:#7a4a2a}
.btns{display:flex;gap:20px;justify-content:center;margin-top:14px}
.btn{font-size:24px;line-height:30px;padding:2px 18px;cursor:pointer;min-width:170px}
.btn small{display:block;font-size:12px;line-height:14px;color:#7a4415}
.btn:active{transform:translateY(4px);filter:none}
.howto{display:flex;gap:10px;justify-content:center;margin-top:12px}
.howto div{width:184px;padding:2px 6px 4px;font-size:12px;line-height:18px;word-break:keep-all;text-align:left}
.howto b{display:block;color:var(--red);font-size:12px}
.titlefish{width:84px;vertical-align:middle}
#best{font-size:12px;margin-top:10px;color:#7a4a2a}
#resultTitle{font-size:24px;line-height:32px}
#resultScore{font-size:48px;line-height:56px;color:var(--red);text-shadow:4px 4px 0 #f0c98f}
#stars{font-size:18px;line-height:28px}

#resultInfo{font-size:12px;line-height:18px}
#review{margin:10px auto 0;max-height:150px;overflow:auto;text-align:left;font-size:12px;line-height:18px;width:660px;user-select:text;padding:4px 8px}
#review p{padding:3px 0;border-bottom:2px dotted #d9c3a0;word-break:keep-all}
#review .ok{color:var(--green)}
#review .no{color:#b03a2a;text-decoration:line-through}

.titlebar{display:flex;gap:12px;justify-content:center;margin-top:10px}
.small{font-size:12px;line-height:16px;padding:0 6px;cursor:pointer}

const ASKS = ["바른 말 붕어빵 주세요!","맞는 낱말로 하나 주세요~","바르게 쓴 붕어빵 부탁해요!","어느 쪽이 맞을까? 하나 주세요!"];

const $ = id => document.getElementById(id);
const stage = $('stage');
function fit(){
  const s = Math.min(innerWidth/960, innerHeight/540);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* 소리 */
let actx=null, muted=false;
function beep(freq, dur=0.1, type='square', vol=0.06, when=0){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const SFX = {
  pour(){beep(300,.08,'triangle',.08);beep(420,.08,'triangle',.06,.05)},
  done(){beep(880,.07,'square',.04)},
  ok(){[660,880,1320].forEach((f,i)=>beep(f,.12,'square',.05,i*.08))},
  no(){beep(220,.25,'sawtooth',.06);beep(160,.3,'sawtooth',.05,.15)},
  burn(){beep(140,.2,'sawtooth',.04)},
  trash(){beep(500,.06,'triangle',.05);beep(250,.1,'triangle',.05,.06)}
};

/* 상태 */
let G = null;
const MOLD_POS = [];
for(let r=0;r<2;r++) for(let c=0;c<3;c++) MOLD_POS.push({x:c*133, y:r*125});

function buildGrid(){
  const grid = $('grid'); grid.innerHTML='';
  G.molds = MOLD_POS.map((p,i)=>{
    const el = document.createElement('div');
    el.className='mold'; el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.zIndex = 1+Math.floor(i/3);
    el.innerHTML = `<img src="${IMG.mold.empty}" alt=""><div class="word out2"></div>`;
    el.addEventListener('pointerdown', e=>{e.preventDefault(); tapMold(i)});
    grid.appendChild(el);
    return {el, img:el.querySelector('img'), word:el.querySelector('.word'), state:'empty', t:0, pick:0};
  });
}
function setMold(m, state){
  m.state = state; m.t = 0;
  m.img.src = IMG.mold[state];
  m.el.classList.remove('cooked','warn','burnt');
  m.el.querySelectorAll('.bar,.px-puff,.clean').forEach(n=>n.remove());
  m.word.textContent='';
  if(state==='batter'){
    m.el.insertAdjacentHTML('beforeend','<div class="px-puff steam"></div><div class="bar"><i></i></div>');
  }
  if(state==='burnt'){
    m.el.classList.add('burnt');
    m.el.insertAdjacentHTML('beforeend','<div class="px-puff smoke"></div><div class="clean fr-red">닦기!</div>');
  }
  if(state==='cooked'){
    void m.el.offsetWidth; m.el.classList.add('cooked');
    // 정답/오답이 고르게 섞이도록
    const others = G.molds.filter(o=>o!==m && o.state==='cooked');
    const cntA = others.filter(o=>o.pick===0).length, cntW = others.length-cntA;
    m.pick = cntA===cntW ? (Math.random()<.5?0:1) : (cntA<cntW?0:1);
    labelMold(m);
  }
}
function labelMold(m){
  if(m.state!=='cooked') return;
  const q = G.q;
  const w = q ? (m.pick===0 ? q.a : q.w) : '';
  m.word.textContent = w;
  m.word.style.fontSize = (w.length<=3?24: w.length===4?20: w.length===5?17:15)+'px';
}

function tapMold(i){
  if(!G || G.paused || G.over) return;
  const m = G.molds[i];
  if(m.state==='empty'){ setMold(m,'batter'); SFX.pour(); }
  else if(m.state==='burnt'){ setMold(m,'empty'); SFX.trash(); addScore(-10, m.el); }
  else if(m.state==='cooked'){ serve(m); }
}
$('kettleBtn').addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(!G || G.paused || G.over) return;
  let n=0; G.molds.forEach(m=>{ if(m.state==='empty'){ setMold(m,'batter'); n++; } });
  if(n) SFX.pour();
});

function addScore(v, el){
  G.score = Math.max(0, G.score+v);
  $('score').textContent = G.score;
  if(el){
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width/960;
    const p = document.createElement('div'); p.className='pop out2';
    p.textContent = (v>0?'+':'')+v; p.style.color = v>0 ? '#fff6a0' : '#ff9a88';
    p.style.left = ((r.left-s.left)/k + 30)+'px'; p.style.top = ((r.top-s.top)/k + 30)+'px';
    stage.appendChild(p); setTimeout(()=>p.remove(),1000);
  }
}
function drawHearts(){
  $('hearts').innerHTML = [0,1,2].map(i=>`<img src="${i<G.hearts?IMG.heart:IMG.heartBroken}" alt="">`).join('');
}

/* 손님 */
const CUSTS = ['girl','boy','grandma','man'];
function nextCustomer(){
  if(G.over) return;
  G.q = nextQuestion();
  const sp = Math.max(MIN_SPEED, Math.pow(SPEED_STEP, G.qi));
  if(G.qi>0 && G.qi%5===0 && sp < G.speed) showSpeedUp();
  G.speed = sp;
  G.cust = CUSTS[(G.qi + G.custOffset) % CUSTS.length];
  G.busy = true;
  const c = $('customer');
  c.className=''; $('custImg').src = IMG.cust[G.cust].normal;
  void c.offsetWidth;
  c.className='in';
  $('progress').textContent = `손님 ${G.qi+1}`;
  setTimeout(()=>{
    if(G.over) return;
    $('askLine').textContent = ASKS[Math.floor(Math.random()*ASKS.length)];
    $('sent').innerHTML = G.q.s.replace('___','<span class="blank">?</span>');
    $('tip').style.display='none';
    $('bubble').classList.add('show'); $('patience').classList.add('show');
    G.patMax = G.cfg.patience*G.speed; G.patience = G.patMax; G.busy = false;
    G.molds.forEach(labelMold);
  }, 550);
}
function serve(m){
  if(G.busy || !G.q) return;
  G.busy = true;
  const right = m.pick===0;
  const word = m.word.textContent;
  setMold(m,'empty');
  // 날아가는 붕어빵
  const r = m.el.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width/960;
  const f = document.createElement('img'); f.src = IMG.fish; f.className='fly';
  const x0 = (r.left-s.left)/k+12, y0 = (r.top-s.top)/k+50;
  f.style.left = x0+'px'; f.style.top = y0+'px';
  stage.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    f.style.transform = `translate(${300-x0}px, ${150-y0}px) scale(.7)`; f.style.opacity='.2';
  }));
  setTimeout(()=>{ f.remove(); judge(right, word); }, 450);
}
function judge(right, word){
  const q = G.q;
  const c = $('customer');
  $('patience').classList.remove('show');
  G.answered++;
  if(right){
    G.correct++; G.combo++;
    const bonus = Math.round(50 * G.patience / G.patMax);
    const pts = 100 + bonus + (G.combo>1 ? Math.min(10, G.combo-1)*20 : 0);
    addScore(pts, c);
    $('custImg').src = IMG.cust[G.cust].happy; c.classList.add('bounce');
    SFX.ok(); G.served++; $('served').textContent = `판매 ${G.served}개`;
    $('askLine').textContent = '맛있겠다! 고마워요~';
  } else {
    G.combo = 0; G.hearts--; drawHearts();
    $('custImg').src = IMG.cust[G.cust].angry; c.classList.add('shake');
    SFX.no();
    $('askLine').textContent = word ? `'${word}'(이)라니요! 틀렸어요.` : '너무 오래 기다렸어요!';
    if(!G.wrong.includes(q)) G.wrong.push(q);
    G.retry.push({q, at:G.qi+RETRY_AFTER});
  }
  showCombo();
  $('sent').innerHTML = q.s.replace('___',`<span class="blank fill-ok">${q.a}</span>`);
  $('tip').innerHTML = '<b>TIP</b>' + q.tip; $('tip').style.display='block';
  G.qi++;
  const wait = right ? 1900 : 3200;
  setTimeout(()=>{
    $('bubble').classList.remove('show');
    c.className='out';
    G.q = null; G.molds.forEach(labelMold);
    if(G.hearts<=0){ setTimeout(endGame, 600); return; }
    setTimeout(nextCustomer, 650);
  }, wait);
}
function showSpeedUp(){
  const el = $('speedUp'); el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  beep(523,.1,'square',.05); beep(784,.15,'square',.05,.1);
  clearTimeout(G.suT); G.suT = setTimeout(()=>el.classList.remove('on'), 1800);
}
function showCombo(){
  const el = $('combo');
  if(G.combo>=2){ el.textContent = `${G.combo} COMBO!`; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }
  else el.classList.remove('on');
}

/* 루프 */
let last=0;
function loop(ts){
  const dt = last ? Math.min(100, ts-last) : 16; last = ts;
  if(G && !G.paused && !G.over){
    G.molds.forEach(m=>{
      if(m.state==='batter'){
        m.t += dt;
        const bar = m.el.querySelector('.bar i'); if(bar) bar.style.width = Math.min(100, m.t/G.cfg.bake*100)+'%';
        if(m.t >= G.cfg.bake){ setMold(m,'cooked'); SFX.done(); }
      } else if(m.state==='cooked'){
        m.t += dt;
        const burn = G.cfg.burn*G.speed;
        if(m.t > burn - Math.min(4000, burn*0.35)) m.el.classList.add('warn');
        if(m.t >= burn){ setMold(m,'burnt'); SFX.burn(); }
      }
    });
    if(G.q && !G.busy){
      G.patience -= dt;
      const p = Math.max(0, G.patience/G.patMax);
      const bar = $('patBar'); bar.style.width = (Math.ceil(p*32)/32*100)+'%';
      bar.style.setProperty('--c', p>.5 ? '#5cb83a' : p>.25 ? '#f6b93b' : '#e2482b');
      if(G.patience<=0){ G.busy = true; judge(false, ''); }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startGame(level){
  G = {level, cfg:LEVELS[level], bag:[], retry:[], last:null, speed:1, qi:0, score:0, hearts:3, combo:0,
       correct:0, answered:0, served:0, wrong:[], q:null, busy:true, paused:false, over:false,
       patience:0, custOffset:Math.floor(Math.random()*4)};
  buildGrid(); drawHearts();
  $('score').textContent='0'; $('served').textContent='판매 0개'; showCombo();
  $('bubble').classList.remove('show'); $('patience').classList.remove('show');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('customer').className='';
  setTimeout(nextCustomer, 300);
}
function nextQuestion(){
  const i = G.retry.findIndex(r=>r.at<=G.qi);
  if(i>=0){ const q = G.retry.splice(i,1)[0].q; G.last = q; return q; }
  if(!G.bag.length){
    G.bag = shuffle(QUESTIONS[G.level]);
    if(G.bag[0]===G.last && G.bag.length>1) G.bag.push(G.bag.shift());
  }
  G.last = G.bag.shift(); return G.last;
}
function endGame(){
  if(G.over) return;
  G.over = true;
  const key = 'bungeo_best_'+G.level;
  let best = 0;
  try{ best = +localStorage.getItem(key)||0; if(G.score>best) localStorage.setItem(key, G.score); }catch(e){}
  $('resultTitle').textContent = '하트가 모두 사라졌어요! 영업 끝';
  $('stars').innerHTML = `손님 <b>${G.served}</b>명에게 팔았어요`;
  $('resultScore').textContent = G.score + '점';
  $('resultInfo').textContent = `${G.answered}명 중 ${G.correct}명 정답` + (G.score>best ? ' · 이 기기 최고 기록!' : best ? ` · 이 기기 최고 ${best}점` : '');
  G.submitted = false; rankAfterGame();
  const rv = $('review');
  if(G.wrong.length){
    rv.style.display='block';
    rv.innerHTML = '<b>다시 보기</b>' + G.wrong.map(q=>`<p>${q.s.replace('___',`<span class="ok">${q.a}</span>`)} (<span class="no">${q.w}</span>) — ${q.tip}</p>`).join('');
  } else rv.style.display='none';
  setTimeout(()=>$('resultScreen').classList.add('on'), 300);
}

/* ===== 순위표 (생각 오락실 통합 로그인) ===== */
const AA = window.ArcadeAuth || null;
async function rankCall(data){
  if(!RANK_API) return {ok:false, error:'순위표 서버가 아직 연결되지 않았어요.'};
  for(let k=0;k<3;k++){
    try{
      const r = await fetch(RANK_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
      const j = await r.json(); if(j.ok || !j.retry) return j;
    }catch(e){}
    await new Promise(r=>setTimeout(r,600*(k+1)));
  }
  return {ok:false, error:'연결하지 못했어요. 인터넷을 확인해 주세요.'};
}
function me(){ return AA ? AA.get() : null; }
function updateLoginBtn(){
  const a = me();
  $('loginBtn').textContent = a ? `${a.nick} 로그인됨` : '로그인';
}
function openLogin(){
  if(!AA){ alertLine('로그인 기능을 불러오지 못했어요.'); return; }
  AA.open({game:GAME_ID, gameName:GAME_NAME, color:'#f6b93b'});
}
function alertLine(html){ $('rankLine').innerHTML = html; }
async function rankAfterGame(){
  if(!RANK_API){ alertLine(''); return; }
  if(G.score<=0){ alertLine('점수가 있어야 순위표에 올라가요.'); return; }
  const a = me();
  if(!a){ alertLine('로그인하면 이 기록을 순위표에 올릴 수 있어요. <button class="small fr-btn" id="rankLoginBtn">로그인하고 올리기</button>'); 
    $('rankLoginBtn').onclick = ()=>{ G.wantSubmit = true; openLogin(); }; return; }
  alertLine(`${a.nick}(으)로 순위표에 올리는 중…`);
  const j = await rankCall({action:'submit', nick:a.nick, pin:a.pin, level:G.level, score:G.score, served:G.served, correct:G.correct});
  if(!j.ok){
    if(['PIN','NOUSER','BLOCKED'].includes(j.code)){ alertLine(`${j.error||'다시 로그인해 주세요.'} <button class="small fr-btn" id="rankLoginBtn">로그인</button>`); $('rankLoginBtn').onclick=()=>{G.wantSubmit=true; openLogin();}; }
    else alertLine(`${j.error||'올리지 못했어요.'} <button class="small fr-btn" id="rankRetry">다시 시도</button>`), $('rankRetry').onclick = rankAfterGame;
    return;
  }
  G.submitted = true; boardCache[G.level] = j;
  const w = j.me_week;
  alertLine(`<b>${a.nick}</b> · 이번 주 ${w?`<b>${w.rank}위</b>`:'-'}` + (j.best ? ' · 새 기록으로 올렸어요!' : ` · 이번 주 최고 ${w?w.s:0}점은 그대로예요`));
}
if(AA) AA.onChange(()=>{
  updateLoginBtn();
  if(G && G.over && G.wantSubmit && !G.submitted && me()){ G.wantSubmit=false; rankAfterGame(); }
});

const boardCache = {};
let boardLv = 'low', boardPd = 'week';
function openBoard(lv){
  boardLv = lv || boardLv;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('boardScreen').classList.add('on');
  drawBoard(); loadBoard();
}
async function loadBoard(){
  if(!RANK_API){ $('boardList').innerHTML = '<div class="empty">순위표 서버가 아직 연결되지 않았어요.</div>'; return; }
  if(!boardCache[boardLv]) $('boardList').innerHTML = '<div class="empty">불러오는 중…</div>';
  const lv = boardLv, a = me();
  const j = await rankCall({action:'board', level:lv, nick:a?a.nick:''});
  if(j.ok){ boardCache[lv] = j; if(lv===boardLv) drawBoard(); }
  else if(!boardCache[lv]) $('boardList').innerHTML = `<div class="empty">${j.error||'불러오지 못했어요.'}</div>`;
}
function drawBoard(){
  document.querySelectorAll('#lvTabs button').forEach(b=>b.classList.toggle('on', b.dataset.lv===boardLv));
  document.querySelectorAll('#pdTabs button').forEach(b=>b.classList.toggle('on', b.dataset.pd===boardPd));
  const j = boardCache[boardLv]; if(!j) return;
  const list = j[boardPd]||[], a = me();
  const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  $('boardList').innerHTML = list.length ? list.map((r,i)=>`<div class="r${i===0?' top1':''}${a&&r.n===a.nick?' me':''}"><span>${i+1}위</span><span>${esc(r.n)}</span><span>${r.s}점</span><span>${r.c}명</span></div>`).join('')
    : `<div class="empty">${boardPd==='week'?'이번 주':'아직'} 기록이 없어요. 첫 번째 주인공이 되어 보세요!</div>`;
  const m = j['me_'+boardPd];
  $('boardMe').innerHTML = a ? (m ? `내 순위: <b>${m.rank}위</b> · ${m.s}점` : `${esc(a.nick)}의 기록이 아직 없어요.`) : '로그인하면 내 순위가 보여요.';
}
document.querySelectorAll('#lvTabs button').forEach(b=>b.onclick=()=>{ boardLv=b.dataset.lv; drawBoard(); loadBoard(); });
document.querySelectorAll('#pdTabs button').forEach(b=>b.onclick=()=>{ boardPd=b.dataset.pd; drawBoard(); });
let boardFrom = 'title';
$('boardBtn').onclick = ()=>{ boardFrom='title'; openBoard(); };
$('boardBtn2').onclick = ()=>{ boardFrom='result'; openBoard(G.level); };
$('boardClose').onclick = ()=>{ $('boardScreen').classList.remove('on'); boardFrom==='result' ? $('resultScreen').classList.add('on') : showTitle(); };
$('loginBtn').onclick = openLogin;
updateLoginBtn();

function showTitle(){
  if(G) G.over = true;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('titleScreen').classList.add('on');
  let lo=0, hi=0;
  try{ lo=+localStorage.getItem('bungeo_best_low')||0; hi=+localStorage.getItem('bungeo_best_high')||0; }catch(e){}
  $('best').textContent = (lo||hi) ? `최고 기록 · 저학년 ${lo}점 · 고학년 ${hi}점` : '';
}

document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.level)));
$('againBtn').onclick = ()=>startGame(G.level);
$('homeBtn').onclick = showTitle;
$('pauseBtn').onclick = ()=>{ if(G && !G.over){ G.paused=true; $('pauseScreen').classList.add('on'); } };
$('resumeBtn').onclick = ()=>{ G.paused=false; $('pauseScreen').classList.remove('on'); };
$('quitBtn').onclick = showTitle;
$('muteBtn').onclick = ()=>{ muted=!muted; $('muteBtn').textContent = muted ? '소리 끔' : '소리 켬'; };
document.addEventListener('visibilitychange',()=>{ if(document.hidden && G && !G.over && !G.paused) $('pauseBtn').onclick(); });
showTitle();
</script>
